<svg xmlns="http://www.w3.org/2000/svg" width="880" height="479" viewBox="0 0 880 479" role="img" aria-label="Limen refuses an admin route without an access policy; adding @guard fixes it">
<title>Limen: the unguarded route doesn't compile; one line fixes it</title>
<style>text{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}@keyframes s0{0%,4.353%{fill-opacity:0}4.425%,99%{fill-opacity:1}100%{fill-opacity:0}}#t0{fill-opacity:0;animation:s0 13.78s linear infinite}@keyframes c1{0%,7.980%{width:0}12.223%,99%{width:122px}100%{width:0}}#r1{animation:c1 13.78s steps(1,end) infinite;animation-timing-function:linear}@keyframes s2{0%,15.851%{fill-opacity:0}15.923%,99%{fill-opacity:1}100%{fill-opacity:0}}#t2{fill-opacity:0;animation:s2 13.78s linear infinite}@keyframes s3{0%,16.721%{fill-opacity:0}16.794%,99%{fill-opacity:1}100%{fill-opacity:0}}#t3{fill-opacity:0;animation:s3 13.78s linear infinite}@keyframes c4{0%,17.592%{width:0}24.447%,99%{width:185px}100%{width:0}}#r4{animation:c4 13.78s steps(1,end) infinite;animation-timing-function:linear}@keyframes s5{0%,28.074%{fill-opacity:0}28.147%,99%{fill-opacity:1}100%{fill-opacity:0}}#t5{fill-opacity:0;animation:s5 13.78s linear infinite}@keyframes s6{0%,28.945%{fill-opacity:0}29.017%,99%{fill-opacity:1}100%{fill-opacity:0}}#t6{fill-opacity:0;animation:s6 13.78s linear infinite}@keyframes s7{0%,29.815%{fill-opacity:0}29.888%,99%{fill-opacity:1}100%{fill-opacity:0}}#t7{fill-opacity:0;animation:s7 13.78s linear infinite}@keyframes s8{0%,30.686%{fill-opacity:0}30.758%,99%{fill-opacity:1}100%{fill-opacity:0}}#t8{fill-opacity:0;animation:s8 13.78s linear infinite}@keyframes c9{0%,34.313%{width:0}38.556%,99%{width:122px}100%{width:0}}#r9{animation:c9 13.78s steps(1,end) infinite;animation-timing-function:linear}@keyframes s10{0%,42.184%{fill-opacity:0}42.256%,99%{fill-opacity:1}100%{fill-opacity:0}}#t10{fill-opacity:0;animation:s10 13.78s linear infinite}@keyframes s11{0%,43.054%{fill-opacity:0}43.127%,99%{fill-opacity:1}100%{fill-opacity:0}}#t11{fill-opacity:0;animation:s11 13.78s linear infinite}@keyframes s12{0%,43.925%{fill-opacity:0}43.997%,99%{fill-opacity:1}100%{fill-opacity:0}}#t12{fill-opacity:0;animation:s12 13.78s linear infinite}@keyframes s13{0%,44.795%{fill-opacity:0}44.868%,99%{fill-opacity:1}100%{fill-opacity:0}}#t13{fill-opacity:0;animation:s13 13.78s linear infinite}@keyframes s14{0%,45.666%{fill-opacity:0}45.738%,99%{fill-opacity:1}100%{fill-opacity:0}}#t14{fill-opacity:0;animation:s14 13.78s linear infinite}@keyframes s15{0%,46.536%{fill-opacity:0}46.609%,99%{fill-opacity:1}100%{fill-opacity:0}}#t15{fill-opacity:0;animation:s15 13.78s linear infinite}@keyframes c16{0%,47.407%{width:0}53.935%,99%{width:177px}100%{width:0}}#r16{animation:c16 13.78s steps(1,end) infinite;animation-timing-function:linear}@keyframes s17{0%,57.563%{fill-opacity:0}57.635%,99%{fill-opacity:1}100%{fill-opacity:0}}#t17{fill-opacity:0;animation:s17 13.78s linear infinite}@keyframes c18{0%,58.433%{width:0}65.615%,99%{width:192px}100%{width:0}}#r18{animation:c18 13.78s steps(1,end) infinite;animation-timing-function:linear}@keyframes s19{0%,69.242%{fill-opacity:0}69.314%,99%{fill-opacity:1}100%{fill-opacity:0}}#t19{fill-opacity:0;animation:s19 13.78s linear infinite}@keyframes s20{0%,70.112%{fill-opacity:0}70.185%,99%{fill-opacity:1}100%{fill-opacity:0}}#t20{fill-opacity:0;animation:s20 13.78s linear infinite}</style>
<rect width="880" height="479" rx="10" fill="#0d1117"/>
<rect width="880" height="36" rx="10" fill="#161b22"/><rect y="26" width="880" height="10" fill="#161b22"/>
<circle cx="22" cy="18" r="6" fill="#ff5f56"/><circle cx="42" cy="18" r="6" fill="#ffbd2e"/><circle cx="62" cy="18" r="6" fill="#27c93f"/>
<text x="440.0" y="22" fill="#8b949e" text-anchor="middle">limen</text>
<text id="t0" x="18" y="75" fill="#8b949e"># An agent wrote an admin endpoint. It forgot the permission check.</text><clipPath id="k1"><rect id="r1" x="18" y="80" height="19" width="0"/></clipPath><text x="18" y="94" fill="#e6edf3" clip-path="url(#k1)">$ cat admin.lmn</text><text id="t2" x="18" y="113" fill="#d2a8ff">route GET &quot;/admin/users&quot; -&gt; str:</text><text id="t3" x="18" y="132" fill="#d2a8ff">    ret &quot;everyone&quot;</text><clipPath id="k4"><rect id="r4" x="18" y="137" height="19" width="0"/></clipPath><text x="18" y="151" fill="#e6edf3" clip-path="url(#k4)">$ limen check admin.lmn</text><text id="t5" x="18" y="170" fill="#ff7b72">limen: error: admin.lmn:1: route GET /admin/users has no access policy. Add @guard(fn) to</text><text id="t6" x="18" y="189" fill="#ff7b72">  require sign-in or another check, or @public(&quot;why anyone may call it&quot;) to serve it to everyone</text><text id="t7" x="18" y="208" fill="#ff7b72">  (Limen denies by default)</text><text id="t8" x="18" y="227" fill="#8b949e"># Add a guard: say who may call the route.</text><clipPath id="k9"><rect id="r9" x="18" y="232" height="19" width="0"/></clipPath><text x="18" y="246" fill="#e6edf3" clip-path="url(#k9)">$ cat admin.lmn</text><text id="t10" x="18" y="265" fill="#d2a8ff">fn staff(req) -&gt; str!:</text><text id="t11" x="18" y="284" fill="#d2a8ff">    ret req.header(&quot;x-user&quot;).unwrap_or_default()</text><text id="t12" x="18" y="303" fill="#d2a8ff"></text><text id="t13" x="18" y="322" fill="#d2a8ff">@guard(staff)</text><text id="t14" x="18" y="341" fill="#d2a8ff">route GET &quot;/admin/users&quot; (auth) -&gt; str:</text><text id="t15" x="18" y="360" fill="#d2a8ff">    ret &quot;hello {auth}&quot;</text><clipPath id="k16"><rect id="r16" x="18" y="365" height="19" width="0"/></clipPath><text x="18" y="379" fill="#e6edf3" clip-path="url(#k16)">$ limen lint admin.lmn</text><text id="t17" x="18" y="398" fill="#56d364">limen: no security findings in admin.lmn</text><clipPath id="k18"><rect id="r18" x="18" y="403" height="19" width="0"/></clipPath><text x="18" y="417" fill="#e6edf3" clip-path="url(#k18)">$ limen routes admin.lmn</text><text id="t19" x="18" y="436" fill="#c9d1d9">METHOD  PATH          KIND      ACCESS                                               AT</text><text id="t20" x="18" y="455" fill="#c9d1d9">GET     /admin/users  route     guard staff                                          admin.lmn:5</text>
</svg>
