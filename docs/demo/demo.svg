8%{fill-opacity:0}44.998%,99%{fill-opacity:1}100%{fill-opacity:0}}#t13{fill-opacity:0;animation:s13 14.14s linear infinite}@keyframes s14{0%,45.776%{fill-opacity:0}45.847%,99%{fill-opacity:1}100%{fill-opacity:0}}#t14{fill-opacity:0;animation:s14 14.14s linear infinite}@keyframes s15{0%,46.624%{fill-opacity:0}46.695%,99%{fill-opacity:1}100%{fill-opacity:0}}#t15{fill-opacity:0;animation:s15 14.14s linear infinite}@keyframes c16{0%,47.473%{width:0}54.472%,99%{width:192px}100%{width:0}}#r16{animation:c16 14.14s steps(1,end) infinite;animation-timing-function:linear}@keyframes s17{0%,58.006%{fill-opacity:0}58.077%,99%{fill-opacity:1}100%{fill-opacity:0}}#t17{fill-opacity:0;animation:s17 14.14s linear infinite}@keyframes c18{0%,58.855%{width:0}66.490%,99%{width:208px}100%{width:0}}#r18{animation:c18 14.14s steps(1,end) infinite;animation-timing-function:linear}@keyframes s19{0%,70.025%{fill-opacity:0}70.095%,99%{fill-opacity:1}100%{fill-opacity:0}}#t19{fill-opacity:0;animation:s19 14.14s linear infinite}@keyframes s20{0%,70.873%{fill-opacity:0}70.944%,99%{fill-opacity:1}100%{fill-opacity:0}}#t20{fill-opacity:0;animation:s20 14.14s linear infinite}</style>
<rect width="880" height="479" rx="10" fill="#0d1117"/>
<rect width="880" height="36" rx="10" fill="#161b22"/><rect y="26" width="880" height="10" fill="#161b22"/>
<circle cx="22" cy="18" r="6" fill="#ff5f56"/><circle cx="42" cy="18" r="6" fill="#ffbd2e"/><circle cx="62" cy="18" r="6" fill="#27c93f"/>
<text x="440.0" y="22" fill="#8b949e" text-anchor="middle">parvez</text>
<text id="t0" x="18" y="75" fill="#8b949e"># An agent wrote an admin endpoint. It forgot the permission check.</text><clipPath id="k1"><rect id="r1" x="18" y="80" height="19" width="0"/></clipPath><text x="18" y="94" fill="#e6edf3" clip-path="url(#k1)">$ cat admin.prvz</text><text id="t2" x="18" y="113" fill="#d2a8ff">route GET &quot;/admin/users&quot; -&gt; str:</text><text id="t3" x="18" y="132" fill="#d2a8ff">    ret &quot;everyone&quot;</text><clipPath id="k4"><rect id="r4" x="18" y="137" height="19" width="0"/></clipPath><text x="18" y="151" fill="#e6edf3" clip-path="url(#k4)">$ parvez check admin.prvz</text><text id="t5" x="18" y="170" fill="#ff7b72">parvez: error: admin.prvz:1: route GET /admin/users has no access policy. Add @guard(fn) to</text><text id="t6" x="18" y="189" fill="#ff7b72">  require sign-in or another check, or @public(&quot;why anyone may call it&quot;) to serve it to everyone</text><text id="t7" x="18" y="208" fill="#ff7b72">  (Parvez denies by default)</text><text id="t8" x="18" y="227" fill="#8b949e"># Add a guard: say who may call the route.</text><clipPath id="k9"><rect id="r9" x="18" y="232" height="19" width="0"/></clipPath><text x="18" y="246" fill="#e6edf3" clip-path="url(#k9)">$ cat admin.prvz</text><text id="t10" x="18" y="265" fill="#d2a8ff">fn staff(req) -&gt; str!:</text><text id="t11" x="18" y="284" fill="#d2a8ff">    ret req.header(&quot;x-user&quot;).unwrap_or_default()</text><text id="t12" x="18" y="303" fill="#d2a8ff"></text><text id="t13" x="18" y="322" fill="#d2a8ff">@guard(staff)</text><text id="t14" x="18" y="341" fill="#d2a8ff">route GET &quot;/admin/users&quot; (auth) -&gt; str:</text><text id="t15" x="18" y="360" fill="#d2a8ff">    ret &quot;hello {auth}&quot;</text><clipPath id="k16"><rect id="r16" x="18" y="365" height="19" width="0"/></clipPath><text x="18" y="379" fill="#e6edf3" clip-path="url(#k16)">$ parvez lint admin.prvz</text><text id="t17" x="18" y="398" fill="#56d364">parvez: no security findings in admin.prvz</text><clipPath id="k18"><rect id="r18" x="18" y="403" height="19" width="0"/></clipPath><text x="18" y="417" fill="#e6edf3" clip-path="url(#k18)">$ parvez routes admin.prvz</text><text id="t19" x="18" y="436" fill="#c9d1d9">METHOD  PATH          KIND      ACCESS                                                AT</text><text id="t20" x="18" y="455" fill="#c9d1d9">GET     /admin/users  route     guard staff                                           admin.prvz:5</text>
</svg>
