<svg xmlns="http://www.w3.org/2000/svg" width="880" height="479" viewBox="0 0 880 479" role="img" aria-label="Parvez refuses an admin route without an access policy; adding @guard fixes it">
<title>Parvez: the unguarded route doesn't compile; one line fixes it</title>
