[package]
name = "parvez"
version = "0.21.0"
edition = "2024"
description = "A small language for HTTP services and CLI tools that compiles to Rust, with built-in security checks"
license = "MIT"
repository = "https://github.com/parvez76/parvez"
keywords = ["language", "transpiler", "security", "rust", "backend"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
semver = "1.0.28"
serde_json = "1.0.154"
sha2 = "0.10"
sqlparser = { version = "0.64.0", default-features = false, features = ["std", "visitor"] }
toml = "1.2.1"
