[package]
name = "parvez"
version = "0.20.0"
edition = "2024"
description = "Parvez: Python-dense syntax that transpiles to Rust"
license = "MIT"
repository = "https://github.com/parvez76/parvez"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
semver = "1.0.28"
serde_json = "1.0.154"
sha2 = "0.10"
sqlparser = { version = "0.64.0", default-features = false, features = ["std", "visitor"] }
toml = "1.2.1"
