# Publishes site/ (plus the installers, and the playground's compiler built from
# this repository) to https://parvez76.github.io/limen/ on every push to main.
name: pages
on:
  push:
    branches: [main]
    paths: [install.sh, install.ps1, site/**, src/**, playground/**, tests/security_corpus/**, Cargo.toml, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Build the playground compiler
        run: cargo build --release --locked --target wasm32-unknown-unknown --manifest-path playground/Cargo.toml
      - name: The playground must match the CLI on the adversarial corpus
        run: node playground/test.mjs playground/target/wasm32-unknown-unknown/release/limen_playground.wasm
      - name: Assemble
        run: |
          set -eu
          mkdir -p _site
          cp -r site/. _site/
          cp playground/target/wasm32-unknown-unknown/release/limen_playground.wasm _site/play/limen.wasm
          mkdir -p _site/play/presets
          for c in flows sql secrets traits stores channels objects_db deep_chain state_chain known_miss; do
            cp "tests/security_corpus/$c.lmn" _site/play/presets/
          done
          cp install.sh install.ps1 _site/
          (cd _site && sha256sum install.sh > install.sh.sha256 && sha256sum install.ps1 > install.ps1.sha256)
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
