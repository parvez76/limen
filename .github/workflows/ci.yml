# Tests on every push to main and every pull request.
name: ci
on:
  push:
    branches: [main, 'ci/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - run: sh -n install.sh
      - run: cargo test --release --locked
      - name: Playground (WebAssembly) matches the CLI on the adversarial corpus
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --locked --target wasm32-unknown-unknown --manifest-path playground/Cargo.toml
          node playground/test.mjs playground/target/wasm32-unknown-unknown/release/parvez_playground.wasm

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - name: cargo test (failures are posted as annotations)
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --locked --no-fail-fast 2>&1 | tee test.log && exit 0
          python - <<'PY'
          import re
          log = open("test.log", encoding="utf-8", errors="replace").read()
          blocks = re.findall(r"^---- (\S+) stdout ----\n(.*?)(?=^---- |^failures:|\Z)", log, re.S | re.M)
          if not blocks:
              blocks = [("build", "\n".join(l for l in log.splitlines() if "error" in l)[-3000:])]
          for name, body in blocks[:10]:
              msg = body.strip()[-3000:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title={name}::{msg}")
          PY
          exit 1
      - name: Build a release archive
        shell: bash
        run: |
          set -euo pipefail
          ver="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          .github/release-build.sh x86_64-pc-windows-msvc "rel/$ver"
          (cd "rel/$ver" && sha256sum *.tar.gz > SHA256SUMS)
          mkdir -p "bad/$ver" && cp rel/$ver/*.tar.gz "bad/$ver/"
          (cd "bad/$ver" && printf '%064d  %s\n' 0 *.tar.gz > SHA256SUMS)
          echo "PARVEZ_TEST_VERSION=$ver" >> "$GITHUB_ENV"
      - name: install.ps1, doctor, new, test, upgrade on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # each stage and any failure become annotations (job logs need admin rights to read)
          function Stage([string]$m) { Write-Output "::notice title=e2e::$m" }
          trap { Write-Output ("::error title=e2e failed::{0} (line {1}: {2})" -f $_, $_.InvocationInfo.ScriptLineNumber, $_.InvocationInfo.Line.Trim()); exit 1 }
          $good = Start-Process python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1','--directory','rel' -PassThru -WindowStyle Hidden
          $bad = Start-Process python -ArgumentList '-m','http.server','8766','--bind','127.0.0.1','--directory','bad' -PassThru -WindowStyle Hidden
          Start-Sleep 3
          $env:PARVEZ_VERSION = $env:PARVEZ_TEST_VERSION
          $env:PARVEZ_NO_MODIFY_PATH = '1'

          Stage 'servers started'
          # a tampered checksum installs nothing
          $env:PARVEZ_DOWNLOAD_BASE = 'http://127.0.0.1:8766'
          $env:PARVEZ_HOME = "$env:RUNNER_TEMP\pz-bad"
          $refused = $false
          try { Get-Content install.ps1 -Raw | Invoke-Expression } catch { $refused = $_.Exception.Message -match 'checksum mismatch' }
          if (-not $refused -or (Test-Path "$env:PARVEZ_HOME\bin\parvez.exe")) { throw 'a tampered download was installed' }

          Stage 'tampered download refused'
          # with the GitHub CLI present, a build that wasn't attested by the release workflow
          # (like this CI build) is refused too
          $env:PARVEZ_DOWNLOAD_BASE = 'http://127.0.0.1:8765'
          $env:PARVEZ_HOME = "$env:RUNNER_TEMP\pz-unattested"
          $refused = $false
          try { Get-Content install.ps1 -Raw | Invoke-Expression } catch { $refused = $_.Exception.Message -match 'attestation .* did not verify' }
          if (-not $refused -or (Test-Path "$env:PARVEZ_HOME\bin\parvez.exe")) { throw 'an unattested build was installed while gh was available' }
          Stage 'unattested build refused (gh present)'

          # the rest runs without gh, as on a machine without the GitHub CLI: checksums only
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'gh.exe')) }) -join ';'
          if (Get-Command gh -ErrorAction SilentlyContinue) { throw 'could not hide gh' }
          $env:PARVEZ_HOME = "$env:RUNNER_TEMP\pz"
          Get-Content install.ps1 -Raw | Invoke-Expression
          $pz = "$env:RUNNER_TEMP\pz\bin\parvez.exe"
          Stage 'installed'
          & $pz --version
          & $pz doctor
          if ($LASTEXITCODE -ne 0) { throw 'parvez doctor failed' }

          Stage 'doctor ok'
          Set-Location $env:RUNNER_TEMP
          & $pz new hello
          Set-Location hello
          & $pz test main.prvz
          if ($LASTEXITCODE -ne 0) { throw 'parvez test failed' }

          Stage 'new + test ok'
          # upgrade replaces the running parvez.exe (renamed aside, then swapped)
          & $pz upgrade --version $env:PARVEZ_TEST_VERSION --force
          if ($LASTEXITCODE -ne 0) { throw 'parvez upgrade failed' }
          & $pz --version
          Stage 'upgrade ok'
          Stop-Process -Id $good.Id, $bad.Id
