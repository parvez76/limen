name: Bug
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest .lmn program and the command you ran
      render: python
  - type: textarea
    id: doctor
    attributes:
      label: Output of `limen doctor`
      render: text
